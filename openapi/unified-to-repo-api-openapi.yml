components:
  schemas:
    RepoBranches:
      items:
        $ref: '#/components/schemas/RepoBranch'
      type: array
    RepoRepository:
      properties:
        created_at:
          format: date-time
          type: string
        description:
          type: string
        id:
          type: string
        is_private:
          type: boolean
        name:
          type: string
        org_id:
          type: string
        owner:
          type: string
        raw:
          additionalProperties: true
          type: object
        updated_at:
          format: date-time
          type: string
        web_url:
          type: string
      required:
      - name
      type: object
    RepoBranch:
      properties:
        created_at:
          format: date-time
          type: string
        id:
          type: string
        name:
          type: string
        raw:
          additionalProperties: true
          type: object
        repo_id:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
      - name
      - repo_id
      type: object
    RepoPullrequest:
      properties:
        closed_at:
          format: date-time
          type: string
        commit_ids:
          $ref: '#/components/schemas/property_RepoPullrequest_commit_ids'
        created_at:
          format: date-time
          type: string
        id:
          type: string
        labels:
          $ref: '#/components/schemas/property_RepoPullrequest_labels'
        raw:
          additionalProperties: true
          type: object
        repo_id:
          type: string
        status:
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          type: string
          x-speakeasy-unknown-values: allow
        updated_at:
          format: date-time
          type: string
        user_ids:
          $ref: '#/components/schemas/property_RepoPullrequest_user_ids'
      type: object
    RepoCommits:
      items:
        $ref: '#/components/schemas/RepoCommit'
      type: array
    RepoPullrequests:
      items:
        $ref: '#/components/schemas/RepoPullrequest'
      type: array
    property_RepoOrganization_user_ids:
      description: id values of the users/employees associated with this organization
      items:
        type: string
      type: array
    property_RepoPullrequest_user_ids:
      items:
        type: string
      type: array
    RepoOrganization:
      properties:
        avatar_url:
          type: string
        created_at:
          format: date-time
          type: string
        description:
          type: string
        id:
          type: string
        name:
          type: string
        raw:
          additionalProperties: true
          type: object
        updated_at:
          format: date-time
          type: string
        user_ids:
          $ref: '#/components/schemas/property_RepoOrganization_user_ids'
        web_url:
          type: string
      type: object
    property_RepoPullrequest_commit_ids:
      items:
        type: string
      type: array
    RepoCommit:
      properties:
        branch_id:
          type: string
        created_at:
          format: date-time
          type: string
        id:
          type: string
        message:
          type: string
        raw:
          additionalProperties: true
          type: object
        repo_id:
          type: string
        updated_at:
          format: date-time
          type: string
        user_id:
          type: string
      required:
      - repo_id
      type: object
    RepoRepositories:
      items:
        $ref: '#/components/schemas/RepoRepository'
      type: array
    RepoOrganizations:
      items:
        $ref: '#/components/schemas/RepoOrganization'
      type: array
    property_RepoPullrequest_labels:
      items:
        type: string
      type: array
  securitySchemes:
    jwt:
      in: header
      name: authorization
      type: apiKey
externalDocs:
  description: API Documentation
  url: https://docs.unified.to
