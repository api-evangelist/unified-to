    Connections:
      items:
        $ref: '#/components/schemas/Connection'
      type: array
    property_Connection_auth:
      description: An authentication object that represents a specific authorized user's connection to an integration.
      properties:
        access_token:
          type: string
        api_url:
          type: string
        app_id:
          type: string
        audience:
          type: string
        authorize_url:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        consumer_key:
          type: string
        consumer_secret:
          type: string
        dev_api_key:
          type: string
        emails:
          $ref: '#/components/schemas/property_Connection_auth_emails'
        expires_in:
          type: number
        expiry_date:
          format: date-time
          type: string
        key:
          type: string
        meta:
          additionalProperties: true
          type: object
        name:
          type: string
        other_auth_info:
          $ref: '#/components/schemas/property_Connection_auth_other_auth_info'
        pem:
          type: string
        refresh_token:
          type: string
        refresh_token_expires_date:
          format: date-time
          type: string
        refresh_token_expires_in:
          type: number
        refresh_url:
          type: string
        state:
          type: string
        token:
          type: string
        token_url:
          type: string
        user_id:
          type: string
      type: object
    property_Connection_auth_other_auth_info:
      description: When integration.auth_type = "other", this field contains the authentication credentials in the same order as token_names
      items:
        type: string
      type: array
    property_Connection_categories:
      description: The Integration categories that this connection supports
      items:
        enum:
        - passthrough
        - hris
        - ats
        - auth
        - crm
        - enrich
        - martech
        - ticketing
        - uc
        - accounting
        - storage
        - commerce
        - payment
        - genai
        - messaging
        - kms
        - task
        - scim
        - lms
        - repo
        - metadata
        - calendar
        - verification
        - ads
        - forms
        - shipping
        - assessment
        - signing
        type: string
        x-speakeasy-unknown-values: allow
      type: array
    Connection:
      description: A connection represents a specific authentication of an integration.
      properties:
        auth:
          $ref: '#/components/schemas/property_Connection_auth'
        auth_aws_arn:
          type: string
        auth_azure_keyvault_id:
          type: string
        auth_gcp_secret_name:
          type: string
        auth_hashi_vault_path:
          type: string
        categories:
          $ref: '#/components/schemas/property_Connection_categories'
        created_at:
          format: date-time
          type: string
        environment:
          default: Production
          type: string
        external_xref:
          type: string
        id:
          type: string
        integration_name:
          type: string
        integration_type:
          type: string
        is_paused:
          type: boolean
        last_healthy_at:
          format: date-time
          type: string
        last_unhealthy_at:
          format: date-time
          type: string
        permissions:
          $ref: '#/components/schemas/property_Connection_permissions'
        updated_at:
          format: date-time
          type: string
        workspace_id:
          type: string
      required:
      - integration_type
      - permissions
      - categories
      type: object
  securitySchemes:
    jwt:
      in: header
      name: authorization
      type: apiKey
externalDocs:
