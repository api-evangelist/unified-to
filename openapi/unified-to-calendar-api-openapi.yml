components:
  schemas:
    property_CalendarEventRecurrence_included_dates:
      description: dates to include in the recurrence, defaults to undefined (no inclusions)
      items:
        type: string
      type: array
    property_CalendarWebinar_conference:
      items:
        $ref: '#/components/schemas/CalendarConference'
      type: array
    CalendarRecordingMedia:
      properties:
        attendees:
          $ref: '#/components/schemas/property_CalendarRecordingMedia_attendees'
        end_at:
          format: date-time
          type: string
        language:
          type: string
        recording_download_url:
          type: string
        start_at:
          format: date-time
          type: string
        transcript_download_url:
          type: string
        transcripts:
          $ref: '#/components/schemas/property_CalendarRecordingMedia_transcripts'
      type: object
    CalendarBusies:
      items:
        $ref: '#/components/schemas/CalendarBusy'
      type: array
    property_CalendarEvent_attendees:
      items:
        $ref: '#/components/schemas/CalendarAttendee'
      type: array
    CalendarConference:
      properties:
        conference_identifier:
          type: string
        country_code:
          type: string
        host_access_code:
          type: string
        label:
          type: string
        notes:
          type: string
        participant_access_code:
          type: string
        region_code:
          type: string
        telephone:
          type: string
        url:
          type: string
      type: object
    CalendarWebinarPanelist:
      properties:
        email:
          type: string
        is_required:
          type: boolean
        join_password:
          type: string
        join_url:
          type: string
        name:
          type: string
        status:
          enum:
          - ACCEPTED
          - REJECTED
          - TENTATIVE
          type: string
          x-speakeasy-unknown-values: allow
      type: object
    property_CalendarEvent_organizer:
      properties:
        email:
          type: string
        is_cohost:
          type: boolean
        name:
          type: string
        required:
          type: boolean
        status:
          enum:
          - ACCEPTED
          - REJECTED
          - TENTATIVE
          type: string
          x-speakeasy-unknown-values: allow
        user_id:
          type: string
      type: object
    property_CalendarEventRecurrence_on_weeks:
      description: week ordinals for BYDAY (e.g., -1 for last, -2 for second-to-last, 1 for first, 2 for second), only used with on_days. 0 is used for days without week ordinals.
      items:
        type: number
      type: array
    CalendarAttendee:
      properties:
        email:
          type: string
        is_cohost:
          type: boolean
        name:
          type: string
        required:
          type: boolean
        status:
          enum:
          - ACCEPTED
          - REJECTED
          - TENTATIVE
          type: string
          x-speakeasy-unknown-values: allow
        user_id:
          type: string
      type: object
    property_CalendarEventRecurrence_excluded_dates:
      description: dates to exclude from the recurrence, defaults to undefined (no exclusions)
      items:
        type: string
      type: array
    property_CalendarRecordingMedia_attendees:
      items:
        $ref: '#/components/schemas/CalendarAttendee'
      type: array
    CalendarCalendars:
      items:
        $ref: '#/components/schemas/CalendarCalendar'
      type: array
    property_CalendarEvent_attachments:
      items:
        $ref: '#/components/schemas/CalendarAttachment'
      type: array
    CalendarRecordings:
      items:
        $ref: '#/components/schemas/CalendarRecording'
      type: array
    property_CalendarEventRecurrence_on_month_days:
      description: days of the month to repeat on, defaults to undefined (every day), only used if frequency is MONTHLY
      items:
        type: number
      type: array
    CalendarRecordingTranscript:
      properties:
        attendee:
          $ref: '#/components/schemas/property_CalendarRecordingTranscript_attendee'
        end_at:
          format: date-time
          type: string
        language:
          type: string
        start_at:
          format: date-time
          type: string
        text:
          type: string
      required:
      - text
      type: object
    CalendarBusy:
      properties:
        description:
          type: string
        end_at:
          format: date-time
          type: string
        id:
          type: string
        raw:
          additionalProperties: true
          type: object
        start_at:
          format: date-time
          type: string
        timezone:
          type: string
      required:
      - start_at
      - end_at
      type: object
    property_CalendarEvent_conference:
      items:
        $ref: '#/components/schemas/CalendarConference'
      type: array
    property_CalendarWebinar_recurrence:
      items:
        $ref: '#/components/schemas/CalendarEventRecurrence'
      type: array
    property_CalendarEventRecurrence_on_months:
      description: months of the year to repeat on, defaults to undefined (every month), only used if frequency is YEARLY, January is 1
      items:
        type: number
      type: array
    property_CalendarWebinar_registrants:
      items:
        $ref: '#/components/schemas/CalendarWebinarRegistrant'
      type: array
    property_CalendarWebinar_panelists:
      items:
        $ref: '#/components/schemas/CalendarWebinarPanelist'
      type: array
    CalendarEvent:
      properties:
        attachments:
          $ref: '#/components/schemas/property_CalendarEvent_attachments'
        attendees:
          $ref: '#/components/schemas/property_CalendarEvent_attendees'
        calendar_id:
          type: string
        conference:
          $ref: '#/components/schemas/property_CalendarEvent_conference'
        created_at:
          type: string
        end_at:
          type: string
        has_conference:
          type: boolean
        id:
          type: string
        is_all_day:
          type: boolean
        is_free:
          type: boolean
        is_private:
          type: boolean
        location:
          type: string
        notes:
          type: string
        organizer:
          $ref: '#/components/schemas/property_CalendarEvent_organizer'
        raw:
          additionalProperties: true
          type: object
        recurrence:
          $ref: '#/components/schemas/property_CalendarEvent_recurrence'
        recurring_event_id:
          type: string
        send_notifications:
          type: boolean
        start_at:
          type: string
        status:
          enum:
          - CANCELED
          - CONFIRMED
          - TENTATIVE
          type: string
          x-speakeasy-unknown-values: allow
        subject:
          type: string
        timezone:
          type: string
        updated_at:
          type: string
        web_url:
          type: string
      type: object
    CalendarWebinarRegistrant:
      properties:
        email:
          type: string
        name:
          type: string
        registered_at:
          format: date-time
          type: string
        registration_reference:
          type: string
        registration_status:
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - CANCELLED
          type: string
          x-speakeasy-unknown-values: allow
      type: object
    property_CalendarEventRecurrence_on_year_days:
      description: days of the year to repeat on, defaults to undefined (every day), only used if frequency is YEARLY
      items:
        type: number
      type: array
    CalendarAttachment:
      properties:
        download_url:
          type: string
        id:
          type: string
        mime_type:
          type: string
        name:
          type: string
      type: object
    property_CalendarWebinar_organizer:
      properties:
        email:
          type: string
        is_cohost:
          type: boolean
        name:
          type: string
        required:
          type: boolean
        status:
          enum:
          - ACCEPTED
          - REJECTED
          - TENTATIVE
          type: string
          x-speakeasy-unknown-values: allow
        user_id:
          type: string
      type: object
    CalendarEventRecurrence:
      properties:
        count:
          type: number
        end_at:
          format: date-time
          type: string
        excluded_dates:
          $ref: '#/components/schemas/property_CalendarEventRecurrence_excluded_dates'
        frequency:
          enum:
          - DAILY
          - WEEKLY
          - MONTHLY
