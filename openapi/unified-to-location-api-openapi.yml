components:
  schemas:
    HrisLocations:
      items:
        $ref: '#/components/schemas/HrisLocation'
      type: array
    property_CommerceLocation_telephones:
      items:
        $ref: '#/components/schemas/CommerceTelephone'
      type: array
    property_CommerceLocation_media:
      items:
        $ref: '#/components/schemas/CommerceItemMedia'
      type: array
    CommerceMetadata:
      properties:
        description:
          type: string
        extra_data:
          additionalProperties: true
          anyOf:
          - type: object
          - type: string
          - type: number
          - type: boolean
          - items:
              anyOf:
              - type: object
              - type: string
              - type: number
              - type: boolean
            type: array
        format:
          enum:
          - TEXT
          - NUMBER
          - DATE
          - BOOLEAN
          - FILE
          - TEXTAREA
          - SINGLE_SELECT
          - MULTIPLE_SELECT
          - MEASUREMENT
          - PRICE
          - YES_NO
          - CURRENCY
          - URL
          type: string
          x-speakeasy-unknown-values: allow
        id:
          type: string
        is_required:
          type: boolean
        namespace:
          type: string
        slug:
          type: string
        value:
          additionalProperties: true
          anyOf:
          - type: object
          - type: string
          - type: number
          - type: boolean
          - items:
              anyOf:
              - type: object
              - type: string
              - type: number
              - type: boolean
            type: array
      type: object
    property_CommerceLocation_categories:
      items:
        type: string
      type: array
    HrisLocation:
      properties:
        address:
          $ref: '#/components/schemas/property_HrisLocation_address'
        company_id:
          type: string
        created_at:
          format: date-time
          type: string
        currency:
          type: string
        description:
          type: string
        external_identifier:
          type: string
        id:
          type: string
        is_active:
          type: boolean
        is_hq:
          type: boolean
        language_locale:
          type: string
        name:
          type: string
        parent_id:
          type: string
        raw:
          additionalProperties: true
          type: object
        telephones:
          $ref: '#/components/schemas/property_HrisLocation_telephones'
        timezone:
          type: string
        updated_at:
          format: date-time
          type: string
      type: object
    property_CommerceLocation_address:
      properties:
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        country:
          type: string
        country_code:
          type: string
        postal_code:
          type: string
        region:
          type: string
        region_code:
          type: string
      type: object
    CommerceLocation:
      properties:
        address:
          $ref: '#/components/schemas/property_CommerceLocation_address'
        categories:
          $ref: '#/components/schemas/property_CommerceLocation_categories'
        created_at:
          format: date-time
          type: string
        currency:
          type: string
        description:
          type: string
        id:
          type: string
        image_url:
          type: string
        is_active:
          type: boolean
        language_locale:
          type: string
        latitude:
          type: number
        location_type:
          enum:
          - RESTAURANT
          - SALON
          - WAREHOUSE
          - STORE
          - OTHER
          type: string
          x-speakeasy-unknown-values: allow
        longitude:
          type: number
        media:
          $ref: '#/components/schemas/property_CommerceLocation_media'
        name:
          type: string
        parent_id:
          type: string
        price_level:
          type: string
        rating:
          type: number
        raw:
          additionalProperties: true
          type: object
        review_count:
          type: number
        telephones:
          $ref: '#/components/schemas/property_CommerceLocation_telephones'
        updated_at:
          format: date-time
          type: string
        web_url:
          type: string
      required:
      - name
      type: object
    property_CommerceItemMedia_metadata:
      items:
        $ref: '#/components/schemas/CommerceMetadata'
      type: array
    CommerceTelephone:
      properties:
        telephone:
          type: string
        type:
          enum:
          - WORK
          - HOME
          - FAX
          - MOBILE
          - OTHER
          type: string
          x-speakeasy-unknown-values: allow
      required:
      - telephone
      type: object
    HrisTelephone:
      properties:
        telephone:
          type: string
        type:
          enum:
          - WORK
          - HOME
          - OTHER
          - FAX
          - MOBILE
          type: string
          x-speakeasy-unknown-values: allow
      required:
      - telephone
      type: object
    property_HrisLocation_address:
      properties:
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        country:
          type: string
        country_code:
          type: string
        postal_code:
          type: string
        region:
          type: string
        region_code:
          type: string
      type: object
    CommerceItemMedia:
      properties:
        alt:
          type: string
        height:
          type: number
        id:
          type: string
        metadata:
          $ref: '#/components/schemas/property_CommerceItemMedia_metadata'
        position:
          type: number
        type:
          enum:
          - image
          - video
          type: string
          x-speakeasy-unknown-values: allow
        url:
          type: string
        width:
          type: number
      required:
      - url
      type: object
    property_HrisLocation_telephones:
      items:
        $ref: '#/components/schemas/HrisTelephone'
      type: array
    CommerceLocations:
      items:
        $ref: '#/components/schemas/CommerceLocation'
      type: array
  securitySchemes:
    jwt:
      in: header
      name: authorization
      type: apiKey
externalDocs:
  description: API Documentation
  url: https://docs.unified.to
