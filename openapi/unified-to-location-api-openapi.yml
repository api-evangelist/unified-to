            - created_at
            - updated_at
            - name
            - address
            - description
            - is_active
            - language_locale
            - parent_id
            - currency
            - location_type
            - telephones
            - rating
            - review_count
            - price_level
            - latitude
            - longitude
            - image_url
            - web_url
            - media
            - raw
            - categories
            type: string
          type: array
      - description: 'Raw parameters to include in the 3rd-party request. Encoded as a URL component. eg. raw parameters: foo=bar&zoo=bar -> raw=foo%3Dbar%26zoo%3Dbar'
        in: query
        name: raw
        required: false
        schema:
          type: string
      - description: ID of the connection
        in: path
        name: connection_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommerceLocations'
          description: Successful
      security:
      - jwt: []
      summary: List all locations
      tags:
      - location
