openapi: 3.0.0
info:
  contact:
    email: hello@unified.to
    url: https://unified.to/contact
  description: One API to Rule Them All
  termsOfService: https://unified.to/tos
  title: Unified.to account refund API
  version: '1.0'
servers:
- description: North American data region
  url: https://api.unified.to
- description: European data region
  url: https://api-eu.unified.to
- description: Australian data region
  url: https://api-au.unified.to
security:
- jwt: []
tags:
- name: refund
paths:
  /payment/{connection_id}/refund:
    get:
      operationId: listPaymentRefunds
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          type: number
      - in: query
        name: offset
        required: false
        schema:
          type: number
      - description: Return only results whose updated date is equal or greater to this value (ISO-8601 / YYYY-MM-DDTHH:MM:SSZ format)
        in: query
        name: updated_gte
        required: false
        schema:
          type: string
      - in: query
        name: sort
        required: false
        schema:
          type: string
      - in: query
        name: order
        required: false
        schema:
          type: string
      - description: Query string to search. eg. email address or name
        in: query
        name: query
        required: false
        schema:
          type: string
      - description: The payment ID to filter by (reference to PaymentPayment)
        in: query
        name: payment_id
        required: false
        schema:
          type: string
      - description: Fields to return
        in: query
        name: fields
        required: false
        schema:
          items:
            enum:
            - id
            - created_at
            - updated_at
            - total_amount
            - payment_id
            - currency
            - notes
            - status
            - reference
            - raw
            type: string
          type: array
      - description: 'Raw parameters to include in the 3rd-party request. Encoded as a URL component. eg. raw parameters: foo=bar&zoo=bar -> raw=foo%3Dbar%26zoo%3Dbar'
        in: query
        name: raw
        required: false
        schema:
          type: string
      - description: ID of the connection
        in: path
        name: connection_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRefunds'
          description: Successful
      security:
      - jwt: []
      summary: List All Refunds
      tags:
      - refund
  /payment/{connection_id}/refund/{id}:
    get:
      operationId: getPaymentRefund
      parameters:
      - description: Fields to return
        in: query
        name: fields
        required: false
        schema:
          items:
            enum:
            - id
            - created_at
            - updated_at
            - total_amount
            - payment_id
            - currency
            - notes
            - status
            - reference
            - raw
            type: string
          type: array
        type: array
      - description: 'Raw parameters to include in the 3rd-party request. Encoded as a URL component. eg. raw parameters: foo=bar&zoo=bar -> raw=foo%3Dbar%26zoo%3Dbar'
        in: query
        name: raw
        required: false
        schema:
          type: string
      - description: ID of the connection
        in: path
        name: connection_id
        required: true
        schema:
          type: string
      - description: ID of the Refund
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRefund'
          description: Successful
      security:
      - jwt: []
      summary: Retrieve a Refund
      tags:
      - refund
components:
  schemas:
    PaymentRefund:
      properties:
        created_at:
          format: date-time
          type: string
        currency:
          type: string
        id:
          type: string
        notes:
          type: string
        payment_id:
          type: string
        raw:
          additionalProperties: true
          type: object
        reference:
          type: string
        status:
          enum:
          - SUCCEEDED
          - PENDING
          - FAILED
          - CANCELED
          type: string
          x-speakeasy-unknown-values: allow
        total_amount:
          type: number
        updated_at:
          format: date-time
          type: string
      required:
      - total_amount
      - payment_id
      type: object
    PaymentRefunds:
      items:
        $ref: '#/components/schemas/PaymentRefund'
      type: array
  securitySchemes:
    jwt:
      in: header
      name: authorization
      type: apiKey
externalDocs:
  description: API Documentation
  url: https://docs.unified.to
