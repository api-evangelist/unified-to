openapi: 3.0.0
info:
  contact:
    email: hello@unified.to
    url: https://unified.to/contact
  description: One API to Rule Them All
  termsOfService: https://unified.to/tos
  title: Unified.to account employee API
  version: '1.0'
servers:
- description: North American data region
  url: https://api.unified.to
- description: European data region
  url: https://api-eu.unified.to
- description: Australian data region
  url: https://api-au.unified.to
security:
- jwt: []
tags:
- name: employee
paths:
  /hris/{connection_id}/employee:
    get:
      operationId: listHrisEmployees
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          type: number
      - in: query
        name: offset
        required: false
        schema:
          type: number
      - description: Return only results whose updated date is equal or greater to this value (ISO-8601 / YYYY-MM-DDTHH:MM:SSZ format)
        in: query
        name: updated_gte
        required: false
        schema:
          type: string
      - in: query
        name: sort
        required: false
        schema:
          type: string
      - in: query
        name: order
        required: false
        schema:
          type: string
      - description: Query string to search. eg. email address or name
        in: query
        name: query
        required: false
        schema:
          type: string
      - description: The company ID to filter by (reference to HrisCompany)
        in: query
        name: company_id
        required: false
        schema:
          type: string
      - description: Fields to return
        in: query
        name: fields
        required: false
        schema:
          items:
            enum:
            - id
            - created_at
            - updated_at
            - name
            - first_name
            - last_name
            - emails
            - title
            - manager_id
            - employment_status
            - gender
            - telephones
            - date_of_birth
            - employee_number
            - hired_at
            - terminated_at
            - termination_reason
            - marital_status
            - employment_type
            - address
            - language_locale
            - currency
            - timezone
            - image_url
            - company_id
            - pronouns
            - employee_roles
            - compensation
            - salutation
            - bio
            - ssn_sin
            - groups
            - locations
            - metadata
            - storage_quota_allocated
            - storage_quota_used
            - storage_quota_available
            - relationships
            - has_mfa
            - timeoff_days_total
            - timeoff_days_used
            - raw
            type: string
          type: array
      - description: 'Raw parameters to include in the 3rd-party request. Encoded as a URL component. eg. raw parameters: foo=bar&zoo=bar -> raw=foo%3Dbar%26zoo%3Dbar'
        in: query
        name: raw
        required: false
        schema:
          type: string
      - description: ID of the connection
        in: path
        name: connection_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HrisEmployees'
          description: Successful
      security:
      - jwt: []
      summary: List All Employees
      tags:
      - employee
    post:
      operationId: createHrisEmployee
      parameters:
      - description: Fields to return
        in: query
        name: fields
        required: false
        schema:
          items:
            enum:
            - id
            - created_at
            - updated_at
            - name
            - first_name
            - last_name
            - emails
            - title
            - manager_id
            - employment_status
            - gender
            - telephones
            - date_of_birth
            - employee_number
            - hired_at
            - terminated_at
            - termination_reason
            - marital_status
            - employment_type
            - address
            - language_locale
            - currency
            - timezone
            - image_url
            - company_id
            - pronouns
            - employee_roles
            - compensation
            - salutation
            - bio
            - ssn_sin
            - groups
            - locations
            - metadata
            - storage_quota_allocated
            - storage_quota_used
            - storage_quota_available
            - relationships
            - has_mfa
            - timeoff_days_total
            - timeoff_days_used
            - raw
            type: string
          type: array
        type: array
      - description: 'Raw parameters to include in the 3rd-party request. Encoded as a URL component. eg. raw parameters: foo=bar&zoo=bar -> raw=foo%3Dbar%26zoo%3Dbar'
        in: query
        name: raw
        required: false
        schema:
          type: string
      - description: ID of the connection
        in: path
        name: connection_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HrisEmployee'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HrisEmployee'
          description: Successful
      security:
      - jwt: []
      summary: Create an Employee
      tags:
      - employee
  /hris/{connection_id}/employee/{id}:
    delete:
      operationId: removeHrisEmployee
      parameters:
      - description: ID of the connection
        in: path
        name: connection_id
        required: true
        schema:
          type: string
      - description: ID of the Employee
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful
        default:
          content: {}
          description: Successful
          headers:
            Content-Type:
              required: false
              schema:
                type: string
      security:
      - jwt: []
      summary: Remove an Employee
      tags:
      - employee
    get:
      operationId: getHrisEmployee
      parameters:
      - description: Fields to return
        in: query
        name: fields
        required: false
        schema:
          items:
            enum:
            - id
            - created_at
            - updated_at
            - name
            - first_name
            - last_name
            - emails
            - title
            - manager_id
            - employment_status
            - gender
            - telephones
            - date_of_birth
            - employee_number
            - hired_at
            - terminated_at
            - termination_reason
            - marital_status
            - employment_type
            - address
            - language_locale
            - currency
            - timezone
            - image_url
            - company_id
            - pronouns
            - employee_roles
            - compensation
            - salutation
            - bio
            - ssn_sin
            - groups
            - locations
            - metadata
            - storage_quota_allocated
            - storage_quota_used
            - storage_quota_available
            - relationships
            - has_mfa
            - timeoff_days_total
            - timeoff_days_used
            - raw
            type: string
          type: array
        type: array
      - description: 'Raw parameters to include in the 3rd-party request. Encoded as a URL component. eg. raw parameters: foo=bar&zoo=bar -> raw=foo%3Dbar%26zoo%3Dbar'
        in: query
        name: raw
        required: false
        schema:
          type: string
      - description: ID of the connection
        in: path
        name: connection_id
        required: true
        schema:
          type: string
      - description: ID of the Employee
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HrisEmployee'
          description: Successful
      security:
      - jwt: []
      summary: Retrieve an Employee
      tags:
      - employee
    patch:
      operationId: patchHrisEmployee
      parameters:
      - description: Fields to return
        in: query
        name: fields
        required: false
        schema:
          items:
            enum:
            - id
            - created_at
            - updated_at
            - name
            - first_name
            - last_name
            - emails
            - title
            - manager_id
            - employment_status
            - gender
            - telephones
            - date_of_birth
            - employee_number
            - hired_at
            - terminated_at
            - termination_reason
            - marital_status
            - employment_type
            - address
            - language_locale
            - currency
            - timezone
            - image_url
            - company_id
            - pronouns
            - employee_roles
            - compensation
            - salutation
            - bio
            - ssn_sin
            - groups
            - locations
            - metadata
            - storage_quota_allocated
            - storage_quota_used
            - storage_quota_available
            - relationships
            - has_mfa
            - timeoff_days_total
            - timeoff_days_used
            - raw
            type: string
          type: array
        type: array
      - description: 'Raw parameters to include in the 3rd-party request. Encoded as a URL component. eg. raw parameters: foo=bar&zoo=bar -> raw=foo%3Dbar%26zoo%3Dbar'
        in: query
        name: raw
        required: false
        schema:
          type: string
      - description: ID of the connection
        in: path
        name: connection_id
        required: true
        schema:
          type: string
      - description: ID of the Employee
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HrisEmployee'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HrisEmployee'
          description: Successful
      security:
      - jwt: []
      summary: Update an Employee
      tags:
      - employee
    put:
      operationId: updateHrisEmployee
      parameters:
      - description: Fields to return
        in: query
        name: fields
        required: false
        schema:
          items:
            enum:
            - id
            - created_at
            - updated_at
            - name
            - first_name
            - last_name
            - emails
            - title
            - manager_id
            - employment_status
            - gender
            - telephones
            - date_of_birth
            - employee_number
            - hired_at
            - terminated_at
            - termination_reason
            - marital_status
            - employment_type
            - address
            - language_locale
            - currency
            - timezone
            - image_url
            - company_id
            - pronouns
            - employee_roles
            - compensation
            - salutation
