components:
  schemas:
    property_AtsActivity_cc:
      items:
        $ref: '#/components/schemas/AtsEmail'
      type: array
    property_AtsJob_metadata:
      items:
        $ref: '#/components/schemas/AtsMetadata'
      type: array
    AtsCompanies:
      items:
        $ref: '#/components/schemas/AtsCompany'
      type: array
    AtsGroup:
      properties:
        id:
          type: string
        name:
          type: string
        type:
          enum:
          - TEAM
          - GROUP
          - DEPARTMENT
          - DIVISION
          - BUSINESS_UNIT
          - BRANCH
          - SUB_DEPARTMENT
          type: string
          x-speakeasy-unknown-values: allow
      type: object
    property_AtsApplication_metadata:
      items:
        $ref: '#/components/schemas/AtsMetadata'
      type: array
    AtsInterviews:
      items:
        $ref: '#/components/schemas/AtsInterview'
      type: array
    AtsApplications:
      items:
        $ref: '#/components/schemas/AtsApplication'
      type: array
    property_AtsOffer_compensation:
      description: compensation details for the offer
      items:
        $ref: '#/components/schemas/AtsCompensation'
      type: array
    AtsStatus:
      properties:
        description:
          type: string
        id:
          type: string
        original_status:
          type: string
        raw:
          additionalProperties: true
          type: object
        status:
          enum:
          - NEW
          - REVIEWING
          - SCREENING
          - SUBMITTED
          - FIRST_INTERVIEW
          - SECOND_INTERVIEW
          - THIRD_INTERVIEW
          - BACKGROUND_CHECK
          - OFFERED
          - ACCEPTED
          - HIRED
          - REJECTED
          - DECLINED
          - WITHDRAWN
          type: string
          x-speakeasy-unknown-values: allow
      type: object
    AtsCompensation:
      properties:
        currency:
          type: string
        frequency:
          enum:
          - ONE_TIME
          - DAY
          - QUARTER
          - YEAR
          - HOUR
          - MONTH
          - WEEK
          type: string
          x-speakeasy-unknown-values: allow
        max:
          type: number
        min:
          type: number
        type:
          enum:
          - SALARY
          - BONUS
          - STOCK_OPTIONS
          - EQUITY
          - OTHER
          type: string
          x-speakeasy-unknown-values: allow
      type: object
    property_AtsJob_groups:
      description: The departments/divisions/teams that this job belongs to
      items:
        $ref: '#/components/schemas/AtsGroup'
      type: array
    AtsCandidateExperience:
      properties:
        company_name:
          type: string
        end_at:
          format: date-time
          type: string
        start_at:
          format: date-time
          type: string
        title:
          type: string
      type: object
    AtsReference:
      properties:
        id:
          type: string
        name:
          type: string
      type: object
    property_AtsCandidate_emails:
      items:
        $ref: '#/components/schemas/AtsEmail'
      type: array
    property_AtsCandidate_link_urls:
      description: URLs for web pages containing additional material about the candidate (LinkedIn, other social media, articles, etc.)
      items:
        type: string
      type: array
    AtsOffer:
