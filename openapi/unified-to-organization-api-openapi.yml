components:
  schemas:
    AdsOrganizations:
      items:
        $ref: '#/components/schemas/AdsOrganization'
      type: array
    property_AccountingOrganization_address:
      properties:
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        country:
          type: string
        country_code:
          type: string
        postal_code:
          type: string
        region:
          type: string
        region_code:
          type: string
      type: object
    property_RepoOrganization_user_ids:
      description: id values of the users/employees associated with this organization
      items:
        type: string
      type: array
    AdsOrganization:
      properties:
        created_at:
          format: date-time
          type: string
        currency:
          type: string
        id:
          type: string
        name:
          type: string
        parent_id:
          type: string
        raw:
          additionalProperties: true
          type: object
        timezone:
          type: string
        updated_at:
          format: date-time
          type: string
      type: object
    RepoOrganization:
      properties:
        avatar_url:
          type: string
        created_at:
          format: date-time
          type: string
        description:
          type: string
        id:
          type: string
        name:
          type: string
        raw:
          additionalProperties: true
          type: object
        updated_at:
          format: date-time
          type: string
        user_ids:
          $ref: '#/components/schemas/property_RepoOrganization_user_ids'
        web_url:
          type: string
      type: object
    AccountingOrganizations:
      items:
        $ref: '#/components/schemas/AccountingOrganization'
      type: array
    AccountingOrganization:
      properties:
        address:
          $ref: '#/components/schemas/property_AccountingOrganization_address'
        created_at:
          format: date-time
          type: string
        currency:
          type: string
        fiscal_year_end_month:
          type: number
        id:
          type: string
        legal_name:
          type: string
        name:
          type: string
        organization_code:
          type: string
        parent_id:
          type: string
        raw:
          additionalProperties: true
          type: object
        tax_number:
          type: string
        timezone:
          type: string
        updated_at:
          format: date-time
          type: string
        website:
          type: string
      type: object
    RepoOrganizations:
      items:
        $ref: '#/components/schemas/RepoOrganization'
      type: array
  securitySchemes:
    jwt:
      in: header
      name: authorization
      type: apiKey
externalDocs:
