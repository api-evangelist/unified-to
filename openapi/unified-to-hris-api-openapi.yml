components:
  schemas:
    HrisGroup:
      properties:
        company_id:
          type: string
        created_at:
          format: date-time
          type: string
        description:
          type: string
        id:
          type: string
        is_active:
          type: boolean
        manager_ids:
          $ref: '#/components/schemas/property_HrisGroup_manager_ids'
        name:
          type: string
        parent_id:
          type: string
        raw:
          additionalProperties: true
          type: object
        type:
          enum:
          - TEAM
          - GROUP
          - DEPARTMENT
          - DIVISION
          - BUSINESS_UNIT
          - BRANCH
          - SUB_DEPARTMENT
          type: string
          x-speakeasy-unknown-values: allow
        updated_at:
          format: date-time
          type: string
        user_ids:
          $ref: '#/components/schemas/property_HrisGroup_user_ids'
      type: object
    HrisLocations:
      items:
        $ref: '#/components/schemas/HrisLocation'
      type: array
    property_HrisEmployeerelationship_address:
      properties:
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        country:
          type: string
        country_code:
          type: string
        postal_code:
          type: string
        region:
          type: string
        region_code:
          type: string
      type: object
    HrisBenefits:
      items:
        $ref: '#/components/schemas/HrisBenefit'
      type: array
    property_HrisTimeshift_compensation:
      items:
        $ref: '#/components/schemas/HrisCompensation'
      type: array
    HrisPayslips:
      items:
        $ref: '#/components/schemas/HrisPayslip'
      type: array
    HrisTelephone:
      properties:
        telephone:
          type: string
        type:
          enum:
          - WORK
          - HOME
          - OTHER
          - FAX
          - MOBILE
          type: string
          x-speakeasy-unknown-values: allow
      required:
      - telephone
      type: object
    property_HrisEmployee_groups:
      description: Which groups/teams/units that this employee/user belongs to.  May not have all of the Group fields present, but should have id, name, or email.
      items:
        $ref: '#/components/schemas/HrisGroup'
      type: array
    property_HrisLocation_address:
      properties:
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        country:
          type: string
        country_code:
          type: string
        postal_code:
          type: string
        region:
          type: string
        region_code:
          type: string
      type: object
    HrisEmployee:
      properties:
        address:
          $ref: '#/components/schemas/property_HrisEmployee_address'
        bio:
          type: string
        company_id:
          type: string
        compensation:
          $ref: '#/components/schemas/property_HrisEmployee_compensation'
        created_at:
          format: date-time
          type: string
        currency:
          type: string
        date_of_birth:
          format: date-time
          type: string
        emails:
          $ref: '#/components/schemas/property_HrisEmployee_emails'
        employee_number:
          type: string
        employee_roles:
          $ref: '#/components/schemas/property_HrisEmployee_employee_roles'
        employment_status:
          enum:
          - ACTIVE
          - INACTIVE
          type: string
          x-speakeasy-unknown-values: allow
        employment_type:
          enum:
          - FULL_TIME
          - PART_TIME
          - CONTRACTOR
          - INTERN
          - CONSULTANT
          - VOLUNTEER
          - CASUAL
          - SEASONAL
          - FREELANCE
          - OTHER
          type: string
          x-speakeasy-unknown-values: allow
        first_name:
          type: string
        gender:
          enum:
          - MALE
          - FEMALE
          - INTERSEX
          - TRANS
          - NON_BINARY
          type: string
          x-speakeasy-unknown-values: allow
        groups:
          $ref: '#/components/schemas/property_HrisEmployee_groups'
        has_mfa:
          type: boolean
        hired_at:
          format: date-time
          type: string
        id:
          type: string
        image_url:
          type: string
        language_locale:
          type: string
        last_name:
          type: string
        locations:
          $ref: '#/components/schemas/property_HrisEmployee_locations'
        manager_id:
          type: string
        marital_status:
          enum:
          - MARRIED
          - SINGLE
          type: string
          x-speakeasy-unknown-values: allow
        metadata:
          $ref: '#/components/schemas/property_HrisEmployee_metadata'
        name:
          type: string
        pronouns:
          type: string
        raw:
          additionalProperties: true
          type: object
        relationships:
          $ref: '#/components/schemas/property_HrisEmployee_relationships'
        salutation:
          type: string
        ssn_sin:
          type: string
        storage_quota_allocated:
          type: number
        storage_quota_available:
          type: number
        storage_quota_used:
          type: number
        telephones:
          $ref: '#/components/schemas/property_HrisEmployee_telephones'
        terminated_at:
          format: date-time
          type: string
        termination_reason:
          type: string
        timeoff_days_total:
          type: number
        timeoff_days_used:
          type: number
        timezone:
          type: string
        title:
          type: string
        updated_at:
          format: date-time
          type: string
      type: object
    HrisMetadata:
      properties:
        extra_data:
          additionalProperties: true
          anyOf:
          - type: object
          - type: string
          - type: number
          - type: boolean
          - items:
              anyOf:
              - type: object
              - type: string
              - type: number
              - type: boolean
            type: array
        format:
          enum:
          - TEXT
          - NUMBER
          - DATE
          - BOOLEAN
          - FILE
          - TEXTAREA
          - SINGLE_SELECT
          - MULTIPLE_SELECT
          - MEASUREMENT
          - PRICE
          - YES_NO
          - CURRENCY
          - URL
          type: string
          x-speakeasy-unknown-values: allow
        id:
          type: string
        namespace:
          type: string
        slug:
          type: string
        value:
          additionalProperties: true
          anyOf:
          - type: object
          - type: string
          - type: number
          - type: boolean
          - items:
              anyOf:
              - type: object
              - type: string
              - type: number
              - type: boolean
            type: array
      type: object
    property_HrisPayslip_details:
      items:
        $ref: '#/components/schemas/HrisPayslipDetail'
      type: array
    HrisDeduction:
      description: Employee-specific deduction/benefit enrolment.
      properties:
        amount:
          type: number
        benefit_id:
          type: string
        company_id:
          type: string
        coverage_level:
          enum:
          - EMPLOYEE_ONLY
          - EMPLOYEE_SPOUSE
          - EMPLOYEE_CHILD
          - EMPLOYEE_CHILDREN
          - EMPLOYEE_FAMILY
          - FAMILY
          - OTHER
          type: string
          x-speakeasy-unknown-values: allow
        created_at:
          format: date-time
          type: string
        end_at:
          format: date-time
          type: string
        frequency:
          enum:
          - ONE_TIME
          - DAY
          - QUARTER
          - YEAR
          - HOUR
          - MONTH
          - WEEK
          type: string
          x-speakeasy-unknown-values: allow
        id:
          type: string
        is_active:
          type: boolean
        notes:
          type: string
        raw:
          additionalProperties: true
          type: object
        start_at:
          format: date-time
          type: string
        type:
          enum:
          - FIXED
          - PERCENTAGE
          type: string
          x-speakeasy-unknown-values: allow
        updated_at:
