          anyOf:
          - type: object
          - type: string
          - type: number
          - type: boolean
          - items:
              anyOf:
              - type: object
              - type: string
              - type: number
              - type: boolean
            type: array
        popularity:
          type: number
        rate_limit_description:
          type: string
        saml:
          additionalProperties: true
          anyOf:
          - type: object
          - type: string
          - type: number
          - type: boolean
          - items:
              anyOf:
              - type: object
              - type: string
              - type: number
              - type: boolean
            type: array
        sandbox:
          additionalProperties: true
          anyOf:
          - type: object
          - type: string
          - type: number
          - type: boolean
          - items:
              anyOf:
              - type: object
              - type: string
              - type: number
              - type: boolean
            type: array
        support:
          $ref: '#/components/schemas/property_Integration_support'
        tested_at:
          format: date-time
          type: string
        text_color:
          type: string
        token_instructions:
          $ref: '#/components/schemas/property_Integration_token_instructions'
        token_names:
          $ref: '#/components/schemas/property_Integration_token_names'
        type:
          type: string
        updated_at:
          type: string
        web_url:
          type: string
      required:
      - type
      - name
      - categories
      type: object
    property_IntegrationSupport_webhook_events:
      properties:
        created:
          $ref: '#/components/schemas/property_IntegrationSupport_webhook_events_created'
        deleted:
          $ref: '#/components/schemas/property_IntegrationSupport_webhook_events_deleted'
        updated:
          $ref: '#/components/schemas/property_IntegrationSupport_webhook_events_updated'
      type: object
    property_IntegrationSupport_webhook_events_deleted:
      items:
        enum:
        - virtual
        - native
        type: string
        x-speakeasy-unknown-values: allow
      type: array
    property_IntegrationSupport_inbound_fields:
      additionalProperties:
        type: string
      type: object
    property_IntegrationSupport_webhook_events_updated:
      items:
        enum:
        - virtual
        - native
        type: string
        x-speakeasy-unknown-values: allow
      type: array
    property_IntegrationSupport_methods:
