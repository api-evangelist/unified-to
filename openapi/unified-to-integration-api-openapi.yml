        description:
          type: string
        fa_icon:
          type: string
        featured:
          type: boolean
        in_progress:
          type: boolean
        is_active:
          type: boolean
        is_hidden:
          type: boolean
        logo_url:
          type: string
        name:
          type: string
        partnership:
