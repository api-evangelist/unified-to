components:
  schemas:
    property_MessagingMessage_mentioned_members:
      description: for email systems, this field represents the CC value
      items:
        $ref: '#/components/schemas/MessagingMember'
      type: array
    property_MessagingMessage_channels:
      description: Represents the names of all channels to which the message is sent. Identifies the channels where the message is posted.
      items:
        $ref: '#/components/schemas/MessagingReference'
      type: array
    property_MessagingEvent_message:
      properties:
        attachments:
          $ref: '#/components/schemas/property_MessagingEvent_message_attachments'
        author_member:
          $ref: '#/components/schemas/property_MessagingEvent_message_author_member'
        buttons:
          $ref: '#/components/schemas/property_MessagingEvent_message_buttons'
        channel_id:
          type: string
        channel_ids:
          $ref: '#/components/schemas/property_MessagingEvent_message_channel_ids'
        channels:
          $ref: '#/components/schemas/property_MessagingEvent_message_channels'
        created_at:
          format: date-time
          type: string
        destination_members:
          $ref: '#/components/schemas/property_MessagingEvent_message_destination_members'
        has_children:
          type: boolean
        hidden_members:
          $ref: '#/components/schemas/property_MessagingEvent_message_hidden_members'
        id:
          type: string
        is_unread:
          type: boolean
        mentioned_members:
          $ref: '#/components/schemas/property_MessagingEvent_message_mentioned_members'
        message:
          type: string
        message_html:
          type: string
        message_markdown:
          type: string
        message_thread_identifier:
          type: string
        parent_id:
          type: string
        raw:
          additionalProperties: true
          type: object
        reactions:
          $ref: '#/components/schemas/property_MessagingEvent_message_reactions'
        reference:
          type: string
        root_message_id:
          type: string
        subject:
          type: string
        updated_at:
          format: date-time
          type: string
        web_url:
          type: string
      type: object
    property_MessagingEvent_user:
      properties:
        id:
          type: string
        name:
          type: string
      type: object
    property_MessagingEvent_message_channels:
      description: Represents the names of all channels to which the message is sent. Identifies the channels where the message is posted.
      items:
        $ref: '#/components/schemas/MessagingReference'
      type: array
    MessagingEvent:
      properties:
        button:
          $ref: '#/components/schemas/property_MessagingEvent_button'
        channel:
          $ref: '#/components/schemas/property_MessagingEvent_channel'
        created_at:
          format: date-time
          type: string
        id:
          type: string
        is_replacing_original:
          type: boolean
        message:
          $ref: '#/components/schemas/property_MessagingEvent_message'
        raw:
          additionalProperties: true
          type: object
        type:
          enum:
          - MESSAGE_RECEIVED
          - REACTION_ADDED
          - REACTION_REMOVED
          - BUTTON_CLICK
          - APP_MENTION
          - CHANNEL_JOINED
          - CHANNEL_LEFT
          - CHANNEL_CREATED
          - CHANNEL_DELETED
          - CHANNEL_RENAMED
          - USER_CREATED
          - USER_DELETED
          - USER_UPDATED
          type: string
          x-speakeasy-unknown-values: allow
        user:
          $ref: '#/components/schemas/property_MessagingEvent_user'
      type: object
    property_MessagingEvent_message_destination_members:
      description: for email systems, this field represents the To value
      items:
        $ref: '#/components/schemas/MessagingMember'
      type: array
    MessagingMessages:
      items:
        $ref: '#/components/schemas/MessagingMessage'
      type: array
    property_MessagingEvent_message_mentioned_members:
      description: for email systems, this field represents the CC value
      items:
        $ref: '#/components/schemas/MessagingMember'
      type: array
    MessagingReference:
      properties:
        id:
          type: string
        name:
          type: string
      type: object
    property_MessagingMessage_author_member:
      description: for email systems, this field represents the From value
      properties:
        email:
          type: string
        image_url:
          type: string
        name:
          type: string
        user_id:
          type: string
      type: object
    property_MessagingEvent_button:
      properties:
        icon:
          type: string
        id:
          type: string
        text:
          type: string
      required:
      - id
      type: object
    property_MessagingMessage_attachments:
      items:
        $ref: '#/components/schemas/MessagingAttachment'
      type: array
    property_MessagingMessage_channel_ids:
      description: '@deprecated; use channels instead'
      items:
        type: string
      type: array
    property_MessagingEvent_message_buttons:
      items:
        $ref: '#/components/schemas/MessagingButton'
      type: array
    property_MessagingMessage_reactions:
      items:
        $ref: '#/components/schemas/MessagingReaction'
      type: array
    property_MessagingMessage_destination_members:
      description: for email systems, this field represents the To value
      items:
        $ref: '#/components/schemas/MessagingMember'
      type: array
    property_MessagingChannel_members:
      items:
        $ref: '#/components/schemas/MessagingMember'
      type: array
    MessagingMember:
      properties:
        email:
          type: string
        image_url:
          type: string
        name:
          type: string
        user_id:
          type: string
      type: object
    property_MessagingMessage_hidden_members:
      description: for email systems, this field represents the BCC value
      items:
        $ref: '#/components/schemas/MessagingMember'
      type: array
    property_MessagingEvent_channel_members:
      items:
        $ref: '#/components/schemas/MessagingMember'
      type: array
    property_MessagingEvent_message_hidden_members:
      description: for email systems, this field represents the BCC value
      items:
        $ref: '#/components/schemas/MessagingMember'
      type: array
    MessagingButton:
      properties:
        icon:
          type: string
        id:
          type: string
        text:
          type: string
      required:
      - id
      type: object
    MessagingReaction:
      properties:
        member:
          $ref: '#/components/schemas/property_MessagingReaction_member'
        reaction:
          type: string
      required:
      - reaction
      - member
      type: object
    property_MessagingEvent_message_author_member:
      description: for email systems, this field represents the From value
      properties:
        email:
          type: string
        image_url:
          type: string
        name:
          type: string
        user_id:
          type: string
      type: object
    property_MessagingEvent_message_attachments:
      items:
        $ref: '#/components/schemas/MessagingAttachment'
      type: array
    MessagingChannels:
      items:
        $ref: '#/components/schemas/MessagingChannel'
      type: array
    MessagingChannel:
      properties:
        created_at:
          format: date-time
          type: string
        description:
          type: string
        has_subchannels:
          type: boolean
        id:
          type: string
        is_active:
          type: boolean
        is_private:
          type: boolean
        members:
          $ref: '#/components/schemas/property_MessagingChannel_members'
        name:
          type: string
        parent_id:
          type: string
        raw:
          additionalProperties: true
          type: object
        updated_at:
          format: date-time
          type: string
        web_url:
          type: string
      required:
      - name
      type: object
    property_MessagingEvent_message_channel_ids:
      description: '@deprecated; use channels instead'
      items:
        type: string
      type: array
    MessagingMessage:
      properties:
        attachments:
          $ref: '#/components/schemas/property_MessagingMessage_attachments'
        author_member:
          $ref: '#/components/schemas/property_MessagingMessage_author_member'
        buttons:
          $ref: '#/components/schemas/property_MessagingMessage_buttons'
        channel_id:
          type: string
        channel_ids:
          $ref: '#/components/schemas/property_MessagingMessage_channel_ids'
        channels:
          $ref: '#/components/schemas/property_MessagingMessage_channels'
