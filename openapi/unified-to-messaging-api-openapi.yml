        name: parent_id
        required: false
        schema:
          type: string
      - description: The channel ID to filter by. You can also use these aliases; INBOX, SENT or DRAFT (reference to MessagingChannel)
        in: query
        name: channel_id
        required: false
        schema:
          type: string
      - description: The start date to filter by (ISO-8601 / YYYY-MM-DDTHH:MM:SSZ format)
        in: query
        name: start_gte
        required: false
        schema:
          type: string
      - description: The end date to filter by (ISO-8601 / YYYY-MM-DDTHH:MM:SSZ format)
        in: query
        name: end_lt
        required: false
        schema:
          type: string
      - description: Whether to flatten grouped or recurring items into individual entries.
        in: query
        name: expand
        required: false
        schema:
          type: boolean
      - description: The user/employee ID to filter by (reference to HrisEmployee)
        in: query
        name: user_id
        required: false
        schema:
          type: string
      - in: query
        name: type
        required: false
        schema:
          type: string
      - description: The user/employee ID to filter by
        in: query
        name: user_mentioned_id
        required: false
        schema:
          type: string
      - description: Fields to return
        in: query
        name: fields
        required: false
        schema:
          items:
            enum:
            - id
            - created_at
            - updated_at
            - channel_id
            - channel_ids
            - channels
            - parent_id
            - root_message_id
            - message_thread_identifier
            - author_member
            - destination_members
            - hidden_members
            - mentioned_members
            - reactions
            - subject
            - message
            - message_html
            - message_markdown
            - attachments
            - web_url
            - reference
            - has_children
            - is_unread
            - buttons
            - raw
            type: string
          type: array
      - description: 'Raw parameters to include in the 3rd-party request. Encoded as a URL component. eg. raw parameters: foo=bar&zoo=bar -> raw=foo%3Dbar%26zoo%3Dbar'
        in: query
        name: raw
        required: false
        schema:
          type: string
      - description: ID of the connection
        in: path
        name: connection_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagingMessages'
          description: Successful
      security:
      - jwt: []
      summary: List All Messages
      tags:
      - messaging
    post:
      operationId: createMessagingMessage
      parameters:
      - description: Fields to return
        in: query
        name: fields
        required: false
        schema:
          items:
            enum:
            - id
            - created_at
            - updated_at
            - channel_id
            - channel_ids
            - channels
            - parent_id
            - root_message_id
            - message_thread_identifier
            - author_member
            - destination_members
            - hidden_members
            - mentioned_members
            - reactions
            - subject
            - message
            - message_html
            - message_markdown
            - attachments
            - web_url
            - reference
            - has_children
            - is_unread
            - buttons
            - raw
            type: string
          type: array
        type: array
      - description: 'Raw parameters to include in the 3rd-party request. Encoded as a URL component. eg. raw parameters: foo=bar&zoo=bar -> raw=foo%3Dbar%26zoo%3Dbar'
        in: query
        name: raw
        required: false
        schema:
          type: string
      - description: ID of the connection
        in: path
