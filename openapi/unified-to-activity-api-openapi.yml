components:
  schemas:
    property_AtsActivity_cc:
      items:
        $ref: '#/components/schemas/AtsEmail'
      type: array
    AtsEmail:
      properties:
        email:
          type: string
        name:
          type: string
        type:
          enum:
          - WORK
          - HOME
          - OTHER
          type: string
          x-speakeasy-unknown-values: allow
      required:
      - email
      type: object
    LmsActivities:
      items:
        $ref: '#/components/schemas/LmsActivity'
      type: array
    property_AtsActivity_bcc:
      items:
        $ref: '#/components/schemas/AtsEmail'
      type: array
    LmsActivity:
      properties:
        assigned_grade:
          type: string
        completed_at:
          format: date-time
          type: string
        content_id:
          type: string
        course_id:
          type: string
        created_at:
          format: date-time
          type: string
        duration_minutes:
          type: number
        id:
          type: string
        is_completed:
          type: boolean
        progress_percentage:
          type: number
        raw:
          additionalProperties: true
          type: object
        started_at:
          format: date-time
          type: string
        student_id:
          type: string
        updated_at:
          format: date-time
          type: string
      type: object
    AtsActivity:
      properties:
        application_id:
          type: string
        bcc:
          $ref: '#/components/schemas/property_AtsActivity_bcc'
        candidate_id:
          type: string
        cc:
          $ref: '#/components/schemas/property_AtsActivity_cc'
        created_at:
          format: date-time
          type: string
        description:
          type: string
        document_ids:
          $ref: '#/components/schemas/property_AtsActivity_document_ids'
        from:
          $ref: '#/components/schemas/property_AtsActivity_from'
        id:
          type: string
        interview_id:
          type: string
        is_private:
          type: boolean
        job_id:
          type: string
        raw:
          additionalProperties: true
          type: object
        sub_type:
          type: string
        title:
          type: string
        to:
          $ref: '#/components/schemas/property_AtsActivity_to'
        type:
          enum:
          - NOTE
          - TASK
          - EMAIL
          type: string
          x-speakeasy-unknown-values: allow
        updated_at:
          format: date-time
          type: string
        user_ids:
          $ref: '#/components/schemas/property_AtsActivity_user_ids'
      type: object
    property_AtsActivity_user_ids:
      description: id values of the recruiters associated with the activity.
      items:
        type: string
      type: array
    property_AtsActivity_from:
      properties:
        email:
          type: string
        name:
          type: string
        type:
          enum:
          - WORK
          - HOME
          - OTHER
          type: string
          x-speakeasy-unknown-values: allow
      required:
      - email
      type: object
    property_AtsActivity_to:
      items:
        $ref: '#/components/schemas/AtsEmail'
      type: array
    AtsActivities:
      items:
        $ref: '#/components/schemas/AtsActivity'
      type: array
    property_AtsActivity_document_ids:
      description: IDs for AtsDocument.get
      items:
        type: string
      type: array
  securitySchemes:
    jwt:
      in: header
      name: authorization
      type: apiKey
externalDocs:
  description: API Documentation
  url: https://docs.unified.to
