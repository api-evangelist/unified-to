            enum:
            - id
            - created_at
            - updated_at
            - document_url
            - document_data
            - filename
            - type
            - candidate_id
            - application_id
            - job_id
            - user_id
            - raw
            type: string
          type: array
        type: array
      - description: 'Raw parameters to include in the 3rd-party request. Encoded as a URL component. eg. raw parameters: foo=bar&zoo=bar -> raw=foo%3Dbar%26zoo%3Dbar'
        in: query
        name: raw
        required: false
