components:
  schemas:
    AtsDocuments:
      items:
        $ref: '#/components/schemas/AtsDocument'
      type: array
    SigningDocument:
      properties:
        completed_at:
          format: date-time
          type: string
        created_at:
          format: date-time
          type: string
        creator_id:
          type: string
        description:
          type: string
        download_url:
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        name:
          type: string
        raw:
          additionalProperties: true
          type: object
        sent_at:
          format: date-time
          type: string
        status:
          enum:
          - DRAFT
          - SENT
          - DELIVERED
          - IN_PROGRESS
          - COMPLETED
          - DECLINED
          - VOIDED
          - EXPIRED
          type: string
          x-speakeasy-unknown-values: allow
        template_id:
          type: string
        updated_at:
          format: date-time
          type: string
      type: object
    SigningDocuments:
      items:
        $ref: '#/components/schemas/SigningDocument'
      type: array
    AtsDocument:
      properties:
        application_id:
          type: string
        candidate_id:
          type: string
        created_at:
          format: date-time
          type: string
        document_data:
          type: string
        document_url:
          type: string
        filename:
          type: string
        id:
          type: string
        job_id:
          type: string
        raw:
          additionalProperties: true
          type: object
        type:
          enum:
          - RESUME
          - COVER_LETTER
          - OFFER_PACKET
          - OFFER_LETTER
          - TAKE_HOME_TEST
          - OTHER
          type: string
          x-speakeasy-unknown-values: allow
        updated_at:
          format: date-time
          type: string
        user_id:
          type: string
      type: object
  securitySchemes:
    jwt:
      in: header
      name: authorization
      type: apiKey
externalDocs:
  description: API Documentation
  url: https://docs.unified.to
